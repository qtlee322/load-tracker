# Every push to main publishes the app and the database and file-storage security rules to Firebase.
# GitHub signs in to Google with Workload Identity Federation — no keys or passwords stored anywhere.
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/757577143595/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deploy@load-tracker-18ce6.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stamp app version
        run: |
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BUILD/g" index.html
          printf '{"v":"%s"}\n' "$BUILD" > version.json

      - name: Deploy hosting + Firestore and Storage rules
        run: |
          set -o pipefail
          npx -y firebase-tools@latest deploy --only hosting,firestore:rules,storage --project load-tracker-18ce6 --non-interactive 2>&1 | tee deploy.log || {
            echo "::error title=Firebase deploy failed::$(grep -iE 'error|denied|permission|not enabled|403|404' deploy.log | tail -n 8 | tr '\n' ' ' | cut -c1-1800)"
            exit 1
          }
